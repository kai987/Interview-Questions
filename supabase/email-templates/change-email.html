<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>新しいメールアドレスを確認｜Interview Questions</title></head>
<body style="margin:0;padding:24px 16px;background:#f6f5f2;color:#252525;font-family:Arial,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif;line-height:1.8">
  <table role="presentation" style="width:100%;max-width:560px;margin:0 auto;border-collapse:collapse;background:#ffffff">
    <tr><td style="padding:32px">
      <p style="margin:0 0 24px;font-size:14px;color:#555555">Interview Questions｜面接練習</p>
      <h1 style="margin:0 0 20px;font-size:24px;line-height:1.5">新しいメールアドレスを確認</h1>
      <p>Interview Questions のメールアドレス変更がリクエストされました。変更を完了するには、下のボタンから確認してください。</p>
      <p style="margin:28px 0"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 20px;border-radius:6px;background:#334b3e;color:#ffffff;text-decoration:none;font-weight:bold">変更を確認する</a></p>
      <p style="font-size:13px;color:#555555">ボタンが開かない場合は、次のリンクをブラウザで開いてください。<br><a href="{{ .ConfirmationURL }}" style="color:#334b3e;word-break:break-all">手続き用リンクを開く</a></p>
      <p style="font-size:13px;color:#555555">このメールに心当たりがない場合は、操作せずに削除してください。リンクや確認コードを他の人に共有しないでください。</p>
      <p style="margin:28px 0 0;border-top:1px solid #e5e3de;padding-top:16px;font-size:12px;color:#666666">Interview Questions｜日本語面接の練習<br>このメールは自動送信です。</p>
    </td></tr>
